<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07070A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JobRadar">
<link rel="manifest" href="manifest.json">
<title>JobRadar</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --bg:#07070A; --s1:#0F0F14; --s2:#17171E; --s3:#1F1F28; --s4:#27273300;
  --bd:rgba(255,255,255,0.06); --bd2:rgba(255,255,255,0.10); --bd3:rgba(255,255,255,0.15);
  --tx:#F0ECF8; --tx2:#9994AA; --tx3:#4A4658;
  --ac:#6366F1; --ac2:#818CF8; --acbg:rgba(99,102,241,0.12);
  --gn:#34D399; --gnbg:rgba(52,211,153,0.12);
  --yw:#FBBF24; --ywbg:rgba(251,191,36,0.12);
  --rd:#F87171; --rdbg:rgba(248,113,113,0.12);
  --or:#FB923C;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Geist',sans-serif}
#app{display:flex;flex-direction:column;height:100%}

/* HEADER */
header{
  padding:calc(var(--st)+14px) 16px 12px;
  background:rgba(7,7,10,0.96);backdrop-filter:blur(20px);
  border-bottom:0.5px solid var(--bd2);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.logo{font-family:'Geist Mono',monospace;font-size:17px;font-weight:600;flex-shrink:0;letter-spacing:-0.03em}
.logo-ac{color:var(--ac2)}

/* TRANSPORT PILL */
.tpill{display:flex;background:var(--s2);border-radius:10px;padding:3px;border:0.5px solid var(--bd2);flex-shrink:0}
.tp{padding:5px 11px;border-radius:8px;border:none;background:transparent;color:var(--tx3);font-size:12px;font-weight:600;font-family:'Geist',sans-serif;cursor:pointer;transition:all .2s;white-space:nowrap}
.tp.on{background:var(--ac);color:#fff;box-shadow:0 2px 8px rgba(99,102,241,0.35)}

.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.done-pill{background:var(--gnbg);border:0.5px solid rgba(52,211,153,0.2);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--gn);font-family:'Geist Mono',monospace;display:none}

/* NAV */
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:0.5px solid var(--bd2);flex-shrink:0;background:rgba(7,7,10,0.97);backdrop-filter:blur(20px);padding-bottom:var(--sb);order:99}
nav button{background:none;border:none;color:var(--tx3);padding:10px 4px 8px;font-size:11px;font-weight:600;font-family:'Geist',sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .2s;letter-spacing:0.01em}
.ni{font-size:20px}
.tind{height:2px;width:20px;background:transparent;border-radius:1px;transition:background .2s}
nav button.on{color:var(--ac2)}
nav button.on .tind{background:var(--ac)}

/* PAGES */
.pages{flex:1;overflow:hidden;position:relative}
.pg{position:absolute;inset:0;overflow-y:auto;padding:0;display:none;-webkit-overflow-scrolling:touch}
.pg.on{display:block}
#pg-map{padding:0}

/* ── PAGE LISTE ── */
#pg-liste{padding:14px}
.search-bar{
  display:flex;align-items:center;gap:8px;
  background:var(--s1);border:0.5px solid var(--bd2);
  border-radius:14px;padding:10px 14px;margin-bottom:10px;
}
.search-bar input{flex:1;background:none;border:none;color:var(--tx);font-family:'Geist',sans-serif;font-size:14px;outline:none}
.search-bar input::placeholder{color:var(--tx3)}

/* TIME SLIDER */
.slider-row{
  display:flex;align-items:center;gap:10px;
  background:var(--s1);border-radius:12px;
  padding:10px 14px;margin-bottom:10px;
  border:0.5px solid var(--bd);
}
.slider-row label{font-size:11px;font-weight:600;color:var(--tx3);white-space:nowrap;letter-spacing:0.04em}
.slider-row input[type=range]{flex:1;accent-color:var(--ac);cursor:pointer}
.slider-val{font-family:'Geist Mono',monospace;font-size:13px;font-weight:600;color:var(--ac);min-width:48px;text-align:right}

/* QUICK FILTERS */
.qf{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.qf::-webkit-scrollbar{display:none}
.qb{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;border:0.5px solid var(--bd2);background:transparent;color:var(--tx3);font-family:'Geist',sans-serif;flex-shrink:0;transition:all .15s}
.qb.on{background:var(--acbg);color:var(--ac2);border-color:rgba(99,102,241,0.3)}

/* LIST ITEMS — no card, just rows */
.list-section-title{
  font-size:10px;font-weight:700;color:var(--tx3);
  letter-spacing:0.08em;text-transform:uppercase;
  padding:10px 2px 6px;
}
.litem{
  background:var(--s1);border-radius:16px;
  border:0.5px solid var(--bd);margin-bottom:6px;
  overflow:hidden;transition:border-color .15s;
}
.litem:active{border-color:var(--bd3)}
.litem-head{padding:13px 14px;display:flex;align-items:center;gap:11px;cursor:pointer}

/* RANK NUMBER */
.rank{
  width:28px;height:28px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Geist Mono',monospace;font-size:12px;font-weight:700;
  flex-shrink:0;background:var(--s3);color:var(--tx3);
}

/* SECTOR COLORS */
.rank-food{background:rgba(251,146,60,0.15);color:var(--or)}
.rank-retail{background:rgba(99,102,241,0.15);color:var(--ac2)}
.rank-logis{background:rgba(251,191,36,0.15);color:var(--yw)}
.rank-livr{background:rgba(52,211,153,0.15);color:var(--gn)}
.rank-autre{background:var(--s3);color:var(--tx3)}

.litem-info{flex:1;min-width:0}
.litem-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.litem-addr{font-size:11px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.litem-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.stbtn{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:'Geist',sans-serif;transition:all .15s}
.s-todo{background:var(--s3);color:var(--tx3)}
.s-done{background:var(--gnbg);color:var(--gn)}
.s-relance{background:var(--ywbg);color:var(--yw)}
.s-nope{background:var(--rdbg);color:var(--rd)}
.litem-time{font-family:'Geist Mono',monospace;font-size:11px;color:var(--tx3)}

/* DETAIL PANEL */
.litem-detail{padding:0 14px 14px;display:none}
.litem-detail.open{display:block}
.dsep{height:0.5px;background:var(--bd);margin-bottom:12px}

.time-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.t3c{background:var(--s2);border-radius:12px;padding:9px 6px;text-align:center;border:0.5px solid var(--bd)}
.t3c.active-t{border-color:var(--ac);background:var(--acbg)}
.t3v{font-family:'Geist Mono',monospace;font-size:16px;font-weight:700}
.t3l{font-size:10px;color:var(--tx3);margin-top:2px}
.tv-w{color:var(--or)}.tv-b{color:var(--gn)}.tv-bus{color:var(--ac2)}

.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.btn-go{background:var(--ac);color:#fff;border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:600;font-family:'Geist',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:0 3px 12px rgba(99,102,241,0.3)}
.btn-go:active{opacity:.85}
.btn-alt{background:var(--s2);color:var(--tx);border:0.5px solid var(--bd2);border-radius:12px;padding:11px;font-size:13px;font-family:'Geist',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.detail-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx3);margin-bottom:8px}
.detail-meta span{display:flex;align-items:center;gap:3px}
.noteinput{background:var(--s2);border:0.5px solid var(--bd);border-radius:11px;padding:9px 11px;color:var(--tx);font-family:'Geist',sans-serif;font-size:12px;outline:none;resize:none;height:50px;width:100%}
.noteinput:focus{border-color:var(--ac)}
.noteinput::placeholder{color:var(--tx3)}
.visited-label{font-size:10px;color:var(--tx3);margin-top:4px;font-family:'Geist Mono',monospace}

/* ── PAGE CARTE ── */
#mapbox{height:100%;width:100%}
.map-fab{
  position:absolute;bottom:calc(14px + var(--sb));left:14px;right:14px;
  z-index:1000;
}
.map-today{
  background:rgba(7,7,10,0.96);backdrop-filter:blur(20px);
  border-radius:18px;border:0.5px solid var(--bd3);
  overflow:hidden;max-height:50vh;display:flex;flex-direction:column;
}
.mt-head{
  padding:13px 16px 10px;border-bottom:0.5px solid var(--bd2);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.mt-title{font-size:13px;font-weight:700;color:var(--tx2);letter-spacing:0.01em}
.mt-subtitle{font-size:11px;color:var(--tx3);margin-top:1px}
.mt-launch{
  background:var(--ac);color:#fff;border:none;border-radius:10px;
  padding:8px 14px;font-size:12px;font-weight:600;
  font-family:'Geist',sans-serif;cursor:pointer;flex-shrink:0;
  box-shadow:0 2px 10px rgba(99,102,241,0.35);
}
.mt-body{overflow-y:auto;padding:8px 12px;flex:1;-webkit-overflow-scrolling:touch}
.mt-body::-webkit-scrollbar{display:none}

/* STOP ROWS */
.stop-row{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:10px;
  margin-bottom:4px;cursor:pointer;
  transition:background .15s;
}
.stop-row:hover,.stop-row:active{background:var(--s2)}
.stop-num{
  width:22px;height:22px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Geist Mono',monospace;font-size:10px;font-weight:700;
  flex-shrink:0;background:var(--s3);color:var(--tx3);
}
.stop-num.done{background:var(--gnbg);color:var(--gn)}
.stop-info{flex:1;min-width:0}
.stop-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-meta{font-size:10px;color:var(--tx3);font-family:'Geist Mono',monospace;margin-top:1px}
.stop-stbtn{border:none;border-radius:7px;padding:3px 8px;font-size:10px;font-weight:600;cursor:pointer;font-family:'Geist',sans-serif;flex-shrink:0}

/* ── PAGE STATS ── */
#pg-stats{padding:14px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.sbox{background:var(--s1);border-radius:16px;padding:13px 14px;border:0.5px solid var(--bd)}
.sbox .v{font-family:'Geist Mono',monospace;font-size:24px;font-weight:700}
.sbox .l{font-size:10px;font-weight:600;color:var(--tx3);margin-top:3px;letter-spacing:0.04em;text-transform:uppercase}
.sec-h{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
.pbar{margin-bottom:8px}
.pbar-row{display:flex;justify-content:space-between;font-size:12px;font-weight:500;margin-bottom:3px}
.pbar-track{height:4px;background:var(--s3);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.infocard{background:var(--s1);border-radius:16px;padding:14px;border:0.5px solid var(--bd);margin-bottom:8px}
.pb{height:calc(20px + var(--sb))}

/* TOAST */
.toast{position:fixed;bottom:calc(70px + var(--sb));left:50%;transform:translateX(-50%) translateY(12px);background:var(--s3);color:var(--tx);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:all .25s;pointer-events:none;z-index:9999;white-space:nowrap;border:0.5px solid var(--bd3);box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* EMPTY */
.empty{text-align:center;padding:48px 20px}
.empty-i{font-size:38px;opacity:.2;margin-bottom:10px}
.empty-t{font-size:13px;color:var(--tx3);line-height:1.6}

/* LEAFLET */
.leaflet-container{background:var(--bg) !important}
.leaflet-popup-content-wrapper{background:var(--s2);color:var(--tx);border:0.5px solid var(--bd3);border-radius:14px;box-shadow:none}
.leaflet-popup-tip{background:var(--s2)}
.leaflet-popup-content{margin:11px 14px;font-family:'Geist',sans-serif;font-size:13px;line-height:1.5}
.leaflet-control-zoom a{background:var(--s2) !important;color:var(--tx) !important;border-color:var(--bd3) !important}
.leaflet-tooltip{background:none;border:none;box-shadow:none;padding:0}
</style>
</head>
<body>
<div id="app">

<header>
  <div class="logo">Job<span class="logo-ac">Radar</span></div>
  <div class="tpill">
    <button class="tp" id="tt-pied" onclick="setT('pied')">🚶</button>
    <button class="tp on" id="tt-velo" onclick="setT('velo')">🚴 Vélo</button>
    <button class="tp" id="tt-bus" onclick="setT('bus')">🚌 Bus</button>
  </div>
  <div class="hdr-r">
    <div class="done-pill" id="done-pill">0/1163</div>
  </div>
</header>

<div class="pages">

  <!-- ── LISTE ── -->
  <div class="pg on" id="pg-liste">
    <div class="search-bar">
      <span style="font-size:15px;color:var(--tx3)">🔍</span>
      <input type="text" id="q" placeholder="Rechercher un nom ou une adresse..." oninput="renderListe()">
    </div>
    <div class="slider-row">
      <label>MAX</label>
      <input type="range" id="tslider" min="5" max="80" value="60" step="5" oninput="onSlider()">
      <div class="slider-val" id="tval">60 min</div>
    </div>
    <div class="qf">
      <button class="qb on" onclick="setF('all',this)">Tous</button>
      <button class="qb" onclick="setF('todo',this)">À faire</button>
      <button class="qb" onclick="setF('done',this)">✓ Faits</button>
      <button class="qb" onclick="setF('near',this)">⚡ &lt;15min</button>
      <button class="qb" onclick="setF('food',this)">🍔</button>
      <button class="qb" onclick="setF('retail',this)">🛒</button>
      <button class="qb" onclick="setF('logis',this)">📦</button>
      <button class="qb" onclick="setF('livr',this)">🚴</button>
    </div>
    <div id="liste"></div>
    <div class="pb"></div>
  </div>

  <!-- ── CARTE ── -->
  <div class="pg" id="pg-map">
    <div id="mapbox"></div>
    <div class="map-fab">
      <div class="map-today">
        <div class="mt-head">
          <div>
            <div class="mt-title" id="mt-title">Itinéraire du jour</div>
            <div class="mt-subtitle" id="mt-sub">— stops à faire</div>
          </div>
          <button class="mt-launch" id="mt-launch" onclick="launchRoute()">
            Lancer dans Maps →
          </button>
        </div>
        <div class="mt-body" id="mt-body"></div>
      </div>
    </div>
  </div>

  <!-- ── STATS ── -->
  <div class="pg" id="pg-stats">
    <div id="stats"></div>
    <div class="pb"></div>
  </div>

</div>

<nav>
  <button class="on" onclick="goTab('liste')"><span class="ni">🗂</span><div class="tind" id="ti-liste"></div><span>Liste</span></button>
  <button onclick="goTab('map')"><span class="ni">🗺</span><div class="tind" id="ti-map"></div><span>Carte</span></button>
  <button onclick="goTab('stats')"><span class="ni">📊</span><div class="tind" id="ti-stats"></div><span>Stats</span></button>
</nav>

</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
// ══════════════════════════════
//  STATE
// ══════════════════════════════
const HOME = { lat:49.4657, lon:1.0832 };
const CLUSTER_R = 0.5;
const ZONE_COLORS = ['#6366F1','#34D399','#FBBF24','#FB923C','#F87171','#06B6D4','#A78BFA','#4ADE80','#FCD34D','#F472B6'];

let ST={}, NO={}, DT={};
let transport='velo', maxT=60, filt='all', tab='liste';
let map=null, mapL=[], routeLine=null;
let ZONES=[], routeStops=[];

const NEXT={todo:'done',done:'relance',relance:'nope',nope:'todo'};
const LABEL={todo:'À faire',done:'Déposé ✓',relance:'Relancer',nope:'Ignoré'};
const CLS={todo:'s-todo',done:'s-done',relance:'s-relance',nope:'s-nope'};
const SCOL={food:'#FB923C',retail:'#818CF8',logis:'#FBBF24',livr:'#34D399',autre:'#4A4658'};
const SLBL={food:'🍔 Restauration',retail:'🛒 Retail',logis:'📦 Logistique',livr:'🚴 Livraison',autre:'💼 Autre'};
const TI={pied:'🚶',velo:'🚴',bus:'🚌'};
const TMODE={pied:'walking',velo:'bicycling',bus:'transit'};

// ══════════════════════════════
//  PERSIST
// ══════════════════════════════
function save(){
  try{
    localStorage.setItem('jr6_st',JSON.stringify(ST));
    localStorage.setItem('jr6_no',JSON.stringify(NO));
    localStorage.setItem('jr6_dt',JSON.stringify(DT));
    localStorage.setItem('jr6_tr',transport);
    localStorage.setItem('jr6_tm',maxT);
  }catch(e){}
}
function loadSaved(){
  try{
    const s=localStorage.getItem('jr6_st');if(s)ST=JSON.parse(s);
    const n=localStorage.getItem('jr6_no');if(n)NO=JSON.parse(n);
    const d=localStorage.getItem('jr6_dt');if(d)DT=JSON.parse(d);
    const t=localStorage.getItem('jr6_tr');if(t)transport=t;
    const m=localStorage.getItem('jr6_tm');if(m)maxT=parseInt(m);
  }catch(e){}
  CSV_DATA.forEach(r=>{if(!ST[r._id])ST[r._id]='todo';if(!NO[r._id])NO[r._id]='';});
}

// ══════════════════════════════
//  HELPERS
// ══════════════════════════════
function gt(r){return transport==='pied'?r.t_pied:transport==='velo'?r.t_velo:r.t_bus;}

function hav(a,b){
  const R=6371,dL=(b.lat-a.lat)*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function gpsu(r){
  if(r.url_maps&&r.url_maps.startsWith('http'))return r.url_maps;
  if(r.lat&&r.lon)return`https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lon}&travelmode=${TMODE[transport]}`;
  return`https://maps.google.com/?q=${encodeURIComponent((r.nom||'')+' '+(r.adresse||''))}`;
}

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

// ══════════════════════════════
//  TRANSPORT
// ══════════════════════════════
function setT(t){
  transport=t;
  document.querySelectorAll('.tp').forEach(b=>b.classList.remove('on'));
  document.getElementById('tt-'+t).classList.add('on');
  buildZones();save();renderAll();
  toast(TI[t]+' Mode '+{pied:'Pied',velo:'Vélo',bus:'Bus'}[t]);
}
function onSlider(){
  maxT=parseInt(document.getElementById('tslider').value);
  document.getElementById('tval').textContent=maxT+' min';
  buildZones();renderListe();
  if(tab==='map')renderMap();
}

// ══════════════════════════════
//  ZONES (clustering simple)
// ══════════════════════════════
function buildZones(){
  const pts=CSV_DATA.filter(r=>r.lat&&r.lon&&gt(r)<=maxT);
  const vis=new Set();ZONES=[];
  pts.sort((a,b)=>hav(HOME,{lat:a.lat,lon:a.lon})-hav(HOME,{lat:b.lat,lon:b.lon}));
  pts.forEach(pt=>{
    if(vis.has(pt._id))return;vis.add(pt._id);
    const nb=pts.filter(p=>!vis.has(p._id)&&hav({lat:pt.lat,lon:pt.lon},{lat:p.lat,lon:p.lon})<=CLUSTER_R);
    const mem=[pt,...nb];nb.forEach(n=>vis.add(n._id));
    const zi=ZONES.length;mem.forEach(m=>{m._zone=zi;});
    const cLat=mem.reduce((s,m)=>s+m.lat,0)/mem.length;
    const cLon=mem.reduce((s,m)=>s+m.lon,0)/mem.length;
    ZONES.push({id:zi,members:tspNN(mem),lat:cLat,lon:cLon,dh:hav(HOME,{lat:cLat,lon:cLon}).toFixed(1),col:ZONE_COLORS[zi%ZONE_COLORS.length]});
  });
  CSV_DATA.filter(r=>!pts.find(p=>p._id===r._id)).forEach(r=>{r._zone=-1;});
  // Build today's route = todo stops sorted by distance
  routeStops=CSV_DATA
    .filter(r=>r.lat&&r.lon&&gt(r)<=maxT&&(ST[r._id]||'todo')==='todo')
    .sort((a,b)=>gt(a)-gt(b))
    .slice(0,10);
}

function tspNN(pts){
  if(pts.length<=1)return pts;
  const uv=[...pts];const rt=[];let c={lat:HOME.lat,lon:HOME.lon};
  while(uv.length){
    let bi=0,bd=Infinity;
    uv.forEach((p,i)=>{const d=hav(c,{lat:p.lat,lon:p.lon});if(d<bd){bd=d;bi=i;}});
    rt.push(uv[bi]);c={lat:uv[bi].lat,lon:uv[bi].lon};uv.splice(bi,1);
  }
  return rt;
}

// ══════════════════════════════
//  LISTE
// ══════════════════════════════
function setF(f,btn){
  filt=f;
  document.querySelectorAll('.qb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderListe();
}

function getFiltered(){
  const q=(document.getElementById('q')?.value||'').toLowerCase();
  return CSV_DATA.filter(r=>{
    if(q&&!(r.nom||'').toLowerCase().includes(q)&&!(r.adresse||'').toLowerCase().includes(q))return false;
    const s=ST[r._id]||'todo',t=gt(r);
    if(t>maxT)return false;
    if(filt==='todo'&&s!=='todo')return false;
    if(filt==='done'&&s!=='done')return false;
    if(filt==='near'&&t>15)return false;
    if(filt==='food'&&r.secteur!=='food')return false;
    if(filt==='retail'&&r.secteur!=='retail')return false;
    if(filt==='logis'&&r.secteur!=='logis')return false;
    if(filt==='livr'&&r.secteur!=='livr')return false;
    return true;
  }).sort((a,b)=>gt(a)-gt(b));
}

function renderListe(){
  const el=document.getElementById('liste');
  const f=getFiltered();
  if(!f.length){
    el.innerHTML=`<div class="empty"><div class="empty-i">🔍</div><div class="empty-t">Aucun résultat.<br>Essaie d'élargir le temps max.</div></div>`;
    return;
  }
  // Group by distance bucket for section headers
  const todo=f.filter(r=>(ST[r._id]||'todo')==='todo');
  const done=f.filter(r=>ST[r._id]==='done');
  const other=f.filter(r=>ST[r._id]==='relance'||ST[r._id]==='nope');
  let html='';
  if(todo.length){
    html+=`<div class="list-section-title">${TI[transport]} À visiter · ${todo.length} établissements</div>`;
    html+=todo.slice(0,120).map((r,i)=>renderItem(r,i+1)).join('');
    if(todo.length>120)html+=`<div style="text-align:center;padding:10px;font-size:12px;color:var(--tx3)">+${todo.length-120} autres. Affine le filtre.</div>`;
  }
  if(done.length){
    html+=`<div class="list-section-title" style="margin-top:6px">✓ Déposés · ${done.length}</div>`;
    html+=done.map(r=>renderItem(r,-1)).join('');
  }
  if(other.length){
    html+=`<div class="list-section-title" style="margin-top:6px">Autres · ${other.length}</div>`;
    html+=other.map(r=>renderItem(r,-1)).join('');
  }
  el.innerHTML=html;
  updateDonePill();
}

function renderItem(r,rank){
  const s=ST[r._id]||'todo',t=gt(r);
  const zoneI=r._zone>=0?ZONES.findIndex(z=>z.id===r._zone):-1;
  const zoneCol=zoneI>=0?ZONES[zoneI].col:'transparent';
  const rankHtml=rank>0
    ?`<div class="rank rank-${r.secteur}">${rank}</div>`
    :`<div class="rank rank-${r.secteur}">${s==='done'?'✓':'—'}</div>`;
  return `
  <div class="litem" id="li-${r._id}">
    <div class="litem-head" onclick="toggleD(${r._id})">
      ${rankHtml}
      <div class="litem-info">
        <div class="litem-name">${r.nom||'?'}</div>
        <div class="litem-addr">${r.adresse||''}</div>
      </div>
      <div class="litem-right">
        <button class="stbtn ${CLS[s]}" onclick="event.stopPropagation();toggleS(${r._id})">${LABEL[s]}</button>
        <div class="litem-time">${TI[transport]} ${t}min</div>
      </div>
    </div>
    <div class="litem-detail" id="ld-${r._id}">
      <div class="dsep"></div>
      <div class="time-3">
        <div class="t3c ${transport==='pied'?'active-t':''}">
          <div class="t3v tv-w">${r.t_pied}</div><div class="t3l">🚶 min</div>
        </div>
        <div class="t3c ${transport==='velo'?'active-t':''}">
          <div class="t3v tv-b">${r.t_velo}</div><div class="t3l">🚴 min</div>
        </div>
        <div class="t3c ${transport==='bus'?'active-t':''}">
          <div class="t3v tv-bus">${r.t_bus}</div><div class="t3l">🚌 min</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-go" onclick="window.open('${gpsu(r)}','_blank')">📍 Naviguer</button>
        ${r.telephone?`<button class="btn-alt" onclick="window.open('tel:${r.telephone}')">📞 ${r.telephone}</button>`:`<button class="btn-alt" onclick="window.open('https://maps.google.com/?q=${encodeURIComponent((r.nom||'')+' '+(r.adresse||''))}','_blank')">🗺 Voir sur Maps</button>`}
      </div>
      <div class="detail-meta">
        ${r.note?`<span>⭐ ${r.note}</span>`:''}
        ${r.dist_km?`<span>📏 ${r.dist_km} km</span>`:''}
        ${zoneI>=0?`<span style="color:${zoneCol}">● Zone ${zoneI+1}</span>`:''}
      </div>
      <textarea class="noteinput" placeholder="Notes perso (manager, horaires, RDV...)" onchange="saveN(${r._id},this.value)">${NO[r._id]||''}</textarea>
      ${DT[r._id]?`<div class="visited-label">Visité le ${DT[r._id]}</div>`:''}
    </div>
  </div>`;
}

function toggleD(id){document.getElementById('ld-'+id)?.classList.toggle('open');}
function toggleS(id){
  ST[id]=NEXT[ST[id]||'todo'];
  if(ST[id]==='done')DT[id]=new Date().toLocaleDateString('fr-FR');
  buildZones();save();renderAll();
  toast({todo:'📋 À faire',done:'✅ CV déposé !',relance:'🔔 Relancer',nope:'❌ Ignoré'}[ST[id]]);
}
function saveN(id,v){NO[id]=v;save();}

function updateDonePill(){
  const done=Object.values(ST).filter(s=>s==='done').length;
  const pct=Math.round(done/CSV_DATA.length*100);
  const el=document.getElementById('done-pill');
  el.textContent=`${done}/${CSV_DATA.length}`;
  el.style.display='block';
}

// ══════════════════════════════
//  MAP — simple et propre
// ══════════════════════════════
function initMap(){
  if(map)return;
  map=L.map('mapbox',{zoomControl:false,attributionControl:false}).setView([HOME.lat,HOME.lon],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
  // Home marker
  L.circleMarker([HOME.lat,HOME.lon],{radius:12,fillColor:'#6366F1',color:'#fff',weight:2.5,fillOpacity:1})
    .bindPopup('<strong style="font-family:Geist Mono">🏠 Chez toi</strong><br><span style="color:#9994AA;font-size:11px">Mont-Saint-Aignan</span>')
    .addTo(map);
}

function renderMap(){
  initMap();
  mapL.forEach(l=>l.remove());mapL=[];
  if(routeLine){routeLine.remove();routeLine=null;}

  // Draw only the today route (not all zones — trop de bruit)
  const stops=routeStops.filter(r=>r.lat&&r.lon);
  if(stops.length>=2){
    routeLine=L.polyline(
      [[HOME.lat,HOME.lon],...stops.map(r=>[r.lat,r.lon])],
      {color:'#6366F1',weight:3,opacity:0.7,dashArray:'8 6'}
    ).addTo(map);
  }

  // All accessible markers (color by done/todo, no number clutter)
  CSV_DATA.filter(r=>r.lat&&r.lon&&gt(r)<=maxT).forEach((r,i)=>{
    const s=ST[r._id]||'todo';
    const done=s==='done',nope=s==='nope';
    const inRoute=routeStops.findIndex(x=>x._id===r._id);
    const fc=done?'#34D399':nope?'#1F1F28':inRoute>=0?'#6366F1':SCOL[r.secteur]||'#4A4658';
    const radius=inRoute>=0?9:6;
    const m=L.circleMarker([r.lat,r.lon],{
      radius,fillColor:fc,color:'#07070A',weight:1.5,
      fillOpacity:nope?0.15:done?0.9:0.85
    });
    // Number only for route stops
    if(inRoute>=0&&!done){
      m.bindTooltip(String(inRoute+1),{permanent:true,direction:'center',className:'leaflet-tooltip',offset:[0,0]});
    }
    m.bindPopup(`
      <strong>${r.nom||'?'}</strong><br>
      <span style="color:#9994AA;font-size:11px">${r.adresse||''}</span><br><br>
      ${TI[transport]} ${gt(r)}min · ${r.dist_km}km${r.note?' · ⭐'+r.note:''}<br><br>
      <button onclick="tsMap(${r._id})" style="background:${fc==='#1F1F28'?'#27273300':fc};color:${done?'#07070A':'#fff'};border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;width:100%;margin-bottom:6px;font-family:Geist,sans-serif;border:0.5px solid ${fc}">${LABEL[s]}</button>
      <a href="${gpsu(r)}" target="_blank" style="display:block;text-align:center;font-size:11px;color:#818CF8;font-family:Geist Mono,monospace">Naviguer ${TI[transport]} →</a>
    `);
    m.addTo(map);mapL.push(m);
  });

  // Fit map to today's route
  const pts=[[HOME.lat,HOME.lon],...stops.map(r=>[r.lat,r.lon])];
  if(pts.length>1)map.fitBounds(pts,{padding:[60,60]});

  renderMapPanel();
}

function renderMapPanel(){
  const stops=routeStops;
  const todoStops=stops.filter(r=>(ST[r._id]||'todo')==='todo');
  document.getElementById('mt-title').textContent=`Itinéraire du jour · ${TI[transport]}`;
  document.getElementById('mt-sub').textContent=`${todoStops.length} stops à faire · ${stops.length} au total`;

  const el=document.getElementById('mt-body');
  if(!stops.length){
    el.innerHTML=`<div style="text-align:center;padding:14px;font-size:13px;color:var(--tx3)">Aucun établissement dans ce rayon</div>`;
    return;
  }
  el.innerHTML=stops.map((r,i)=>{
    const s=ST[r._id]||'todo';
    return`<div class="stop-row" onclick="tsMap(${r._id})">
      <div class="stop-num ${s==='done'?'done':''}">${s==='done'?'✓':(i+1)}</div>
      <div class="stop-info">
        <div class="stop-name" style="${s==='done'?'text-decoration:line-through;opacity:.4':''}">${r.nom||'?'}</div>
        <div class="stop-meta">${TI[transport]} ${gt(r)}min · ${r.dist_km}km · ${r.adresse?.split(',')[0]||''}</div>
      </div>
      <button class="stop-stbtn ${CLS[s]}">${LABEL[s]}</button>
    </div>`;
  }).join('');
}

function launchRoute(){
  const todo=routeStops.filter(r=>(ST[r._id]||'todo')==='todo'&&r.lat&&r.lon).slice(0,9);
  if(!todo.length){toast('Tous les stops sont faits !');return;}
  const coords=todo.map(r=>`${r.lat},${r.lon}`).join('/');
  window.open(`https://www.google.com/maps/dir/${HOME.lat},${HOME.lon}/${coords}`,'_blank');
}

function tsMap(id){
  ST[id]=NEXT[ST[id]||'todo'];
  if(ST[id]==='done')DT[id]=new Date().toLocaleDateString('fr-FR');
  buildZones();save();renderAll();
  toast({todo:'📋 À faire',done:'✅ CV déposé !',relance:'🔔 Relancer',nope:'❌ Ignoré'}[ST[id]]);
}

// ══════════════════════════════
//  STATS
// ══════════════════════════════
function renderStats(){
  const el=document.getElementById('stats');
  const total=CSV_DATA.length;
  const inR=CSV_DATA.filter(r=>gt(r)<=maxT).length;
  const done=Object.values(ST).filter(s=>s==='done').length;
  const rl=Object.values(ST).filter(s=>s==='relance').length;
  const pct=total?Math.round(done/total*100):0;
  const secs=['food','retail','logis','livr','autre'];
  const byDay={};
  Object.entries(DT).forEach(([id,d])=>{if(ST[id]==='done')byDay[d]=(byDay[d]||0)+1;});
  const top=CSV_DATA.filter(r=>gt(r)<=maxT&&(ST[r._id]||'todo')==='todo')
    .map(r=>({...r,score:Math.round((r.note||3)*15+Math.max(0,80-gt(r)))}))
    .sort((a,b)=>b.score-a.score).slice(0,5);

  el.innerHTML=`
    <div class="sg">
      <div class="sbox"><div class="v">${total}</div><div class="l">Scrapés</div></div>
      <div class="sbox"><div class="v" style="color:var(--ac2)">${inR}</div><div class="l">${TI[transport]} Accessibles</div></div>
      <div class="sbox"><div class="v" style="color:var(--gn)">${done}</div><div class="l">CV Déposés</div></div>
      <div class="sbox"><div class="v" style="color:var(--yw)">${rl}</div><div class="l">À Relancer</div></div>
    </div>

    <div class="infocard" style="margin-bottom:8px">
      <div class="sec-h">Avancement global</div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
        <div style="flex:1;height:5px;background:var(--s3);border-radius:3px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:var(--gn);border-radius:3px;transition:width .8s"></div>
        </div>
        <div style="font-family:'Geist Mono',monospace;font-size:15px;font-weight:700;color:var(--gn)">${pct}%</div>
      </div>
    </div>

    <div class="infocard" style="margin-bottom:8px">
      <div class="sec-h">Accessibilité (max ${maxT}min)</div>
      ${[{i:'🚶',l:'À pied',n:CSV_DATA.filter(r=>r.t_pied<=maxT).length,c:'var(--or)'},
         {i:'🚴',l:'Vélo',n:CSV_DATA.filter(r=>r.t_velo<=maxT).length,c:'var(--gn)'},
         {i:'🚌',l:'Bus',n:CSV_DATA.filter(r=>r.t_bus<=maxT).length,c:'var(--ac2)'}
      ].map(m=>`<div class="pbar">
        <div class="pbar-row"><span>${m.i} ${m.l}</span><span style="color:var(--tx3);font-family:'Geist Mono',monospace">${m.n}</span></div>
        <div class="pbar-track"><div class="pbar-fill" style="width:${Math.round(m.n/total*100)}%;background:${m.c}"></div></div>
      </div>`).join('')}
    </div>

    <div class="infocard" style="margin-bottom:8px">
      <div class="sec-h">Par secteur</div>
      ${secs.map(s=>{
        const t=CSV_DATA.filter(r=>r.secteur===s).length;
        const d=CSV_DATA.filter(r=>r.secteur===s&&ST[r._id]==='done').length;
        if(!t)return'';
        return`<div class="pbar">
          <div class="pbar-row"><span>${{food:'🍔',retail:'🛒',logis:'📦',livr:'🚴',autre:'💼'}[s]} ${s}</span><span style="color:var(--tx3);font-family:'Geist Mono',monospace">${d}/${t}</span></div>
          <div class="pbar-track"><div class="pbar-fill" style="width:${Math.round(d/t*100)}%;background:${SCOL[s]}"></div></div>
        </div>`;
      }).join('')}
    </div>

    ${Object.keys(byDay).length?`
    <div class="infocard" style="margin-bottom:8px">
      <div class="sec-h">Activité par jour</div>
      ${Object.entries(byDay).sort((a,b)=>a[0].localeCompare(b[0])).map(([d,c])=>`
        <div class="pbar">
          <div class="pbar-row"><span style="font-family:'Geist Mono',monospace;font-size:11px">${d}</span><span style="color:var(--tx3)">+${c} CV</span></div>
          <div class="pbar-track"><div class="pbar-fill" style="width:${Math.min(100,c*15)}%;background:var(--ac)"></div></div>
        </div>`).join('')}
    </div>`:''}

    ${top.length?`
    <div class="infocard" style="margin-bottom:8px">
      <div class="sec-h">Top 5 à faire maintenant ${TI[transport]}</div>
      ${top.map((r,i)=>`
        <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--bd)">
          <div style="font-family:'Geist Mono',monospace;font-size:14px;font-weight:700;color:var(--ac2);width:16px">${i+1}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.nom||'?'}</div>
            <div style="font-size:10px;color:var(--tx3);font-family:'Geist Mono',monospace;margin-top:1px">${TI[transport]}${gt(r)}min · ${r.dist_km}km</div>
          </div>
          <button class="btn-go" style="padding:7px 10px;font-size:11px;box-shadow:none" onclick="window.open('${gpsu(r)}','_blank')">📍</button>
        </div>`).join('')}
    </div>`:''}

    <div class="infocard">
      <div class="sec-h" style="margin-bottom:10px">Données &amp; Reset</div>
      <p style="font-size:12px;color:var(--tx3);line-height:1.6;margin-bottom:10px">
        <strong style="color:var(--tx)">1163 établissements</strong> scrapés autour de Rouen.<br>
        🚶 5 km/h · 🚴 15 km/h · 🚌 20 km/h + 8min<br>
        Zones créées par clustering 500m.
      </p>
      <button onclick="if(confirm('Tout remettre à zéro ?')){resetAll()}" style="width:100%;background:var(--rdbg);color:var(--rd);border:0.5px solid rgba(248,113,113,0.25);border-radius:10px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Geist',sans-serif">
        🗑 Réinitialiser tous les statuts
      </button>
    </div>
    <div class="pb"></div>
  `;
}

function goTab(t){
  tab=t;
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  document.getElementById('pg-'+t).classList.add('on');
  document.querySelectorAll('[id^="ti-"]').forEach(e=>e.style.background='transparent');
  const ti=document.getElementById('ti-'+t);if(ti)ti.style.background='var(--ac)';
  document.querySelectorAll('nav button').forEach(b=>{if((b.getAttribute('onclick')||'').includes("'"+t+"'"))b.classList.add('on');});
  if(t==='map')renderMap();
  if(t==='stats')renderStats();
}

function resetAll(){
  CSV_DATA.forEach(r=>{ST[r._id]='todo';NO[r._id]='';DT[r._id]='';});
  buildZones();save();renderAll();toast('🔄 Reset effectué');
}
function renderAll(){renderListe();if(tab==='map')renderMap();if(tab==='stats')renderStats();}
